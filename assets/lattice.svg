<svg width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="il-bg" cx="28%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#16222c"/>
      <stop offset="48%" stop-color="#0d141a"/>
      <stop offset="100%" stop-color="#070a0d"/>
    </radialGradient>
    <radialGradient id="il-vegas" cx="88%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#e08a2a" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#e08a2a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#e08a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="il-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2fb4c9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2fb4c9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2fb4c9" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <rect width="1600" height="1000" fill="url(#il-bg)"/>
  <rect width="1600" height="1000" fill="url(#il-vegas)"/>

  <g opacity="0.5">
    <!-- interlinked lattice -->
    <path stroke="#2fb4c9" stroke-width="1.5" fill="none" d="M180,180 L440,300 L300,560 L120,420 Z"/>
    <path stroke="#9a6bd6" stroke-width="1.5" fill="none" d="M440,300 L760,220 L820,480 L300,560"/>
    <path stroke="#2fb4c9" stroke-width="1.5" fill="none" d="M760,220 L1080,360 L820,480"/>
    <path stroke="#9a6bd6" stroke-width="1.5" fill="none" d="M1080,360 L1360,260 L1300,560 L1080,360"/>
    <path stroke="#2fb4c9" stroke-width="1.5" fill="none" d="M300,560 L520,760 L820,480"/>
    <path stroke="#9a6bd6" stroke-width="1.5" fill="none" d="M520,760 L900,820 L1300,560"/>
    <path stroke="#2fb4c9" stroke-width="1.5" fill="none" d="M900,820 L1180,920 L1300,560"/>

    <circle fill="#9fe4ef" cx="180" cy="180" r="4.5"/>
    <circle fill="#c7a9ef" cx="440" cy="300" r="5.5"/>
    <circle fill="#9fe4ef" cx="760" cy="220" r="5"/>
    <circle fill="#c7a9ef" cx="1080" cy="360" r="6"/>
    <circle fill="#9fe4ef" cx="1360" cy="260" r="4.5"/>
