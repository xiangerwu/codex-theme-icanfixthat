    <path stroke="#9a6bd6" stroke-width="1.5" fill="none" d="M0,90 L180,180 L40,330 L0,300"/>
    <path stroke="#2fb4c9" stroke-width="1.5" fill="none" d="M40,330 L120,420 L20,640 L0,620"/>
